    <!-- ── Idiomas ──
         La versión en inglés es una página propia (/en/, ver app-v2/en/), no un
         cambio de textos sobre esta misma URL: así el buscador puede indexar
         cada idioma por separado. `x-default` apunta al español, que es el
         mercado principal. Si se toca una de estas tres líneas, hay que tocar
         las mismas en en/index.html — han de ser recíprocas o Google descarta
         la relación entera. -->
    <link rel="canonical" href="https://bimsaddin.com/">
    <link rel="alternate" hreflang="es" href="https://bimsaddin.com/">
    <link rel="alternate" hreflang="en" href="https://bimsaddin.com/en/">
    <link rel="alternate" hreflang="x-default" href="https://bimsaddin.com/">

    <!-- ── Datos estructurados ──
         Describe el producto para que el buscador pueda enseñar precio y
         plataforma en el resultado. NO lleva aggregateRating: no hay
         valoraciones reales que declarar, y la sección de testimonios del
         propio sitio dice explícitamente que no se inventan. Inventarlas aquí
         sería mentir en un formato que Google penaliza. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "BIMS",
      "applicationCategory": "DesignApplication",
      "applicationSubCategory": "Complemento para Autodesk Revit",
      "operatingSystem": "Windows 10, Windows 11",
      "softwareRequirements": "Autodesk Revit 2024, 2025, 2026 o 2027",
      "url": "https://bimsaddin.com/",
      "inLanguage": "es",
      "description": "Add-in profesional para Autodesk Revit que automatiza encofrado, refuerzo, tarrajeo y exportación DWG.",
      "offers": {
        "@type": "Offer",
        "price": "60",
        "priceCurrency": "PEN",
        "category": "subscription",
        "url": "https://bimsaddin.com/#precios",
        "availability": "https://schema.org/InStock"
      },
      "publisher": {
        "@type": "Organization",
        "name": "BIMS",
        "url": "https://bimsaddin.com/",
        "email": "soporte@bimsaddin.com"
      }
    }
    </script>

    <!-- ── Culqi Checkout v4 ──
         `defer` es IMPORTANTE: este script pesa ~850 KB (más que todo el bundle
         de la web) y sin él bloqueaba el parseo del HTML, retrasando la primera
         pintura para TODOS los visitantes, incluidos los que nunca abren el
         checkout. Con defer se descarga en paralelo y se ejecuta al terminar de
         parsear, antes del módulo de React, así que `window.Culqi` sigue estando
         listo mucho antes de que nadie pueda pulsar «Pagar».

         NO añadir `integrity="sha384-..."` (SRI) a este script: Culqi actualiza
         su SDK sin avisar y sin versionar la URL, así que un hash fijo dejaría
         de coincidir en la primera actualización suya y el navegador bloquearía
         el script — cobros caídos sin ningún cambio por nuestra parte. SRI sirve
         para recursos estáticos versionados, no para SDKs de pasarela en vivo. -->
    <script defer src="https://checkout.culqi.com/js/v4"></script>
