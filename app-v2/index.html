<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="BIMS — Add-in profesional para Autodesk Revit que automatiza encofrado, refuerzo, tarrajeo y exportación DWG. Compatible con Revit 2024, 2025, 2026 y 2027.">
    <title>BIMS — Automatiza encofrado, tarrajeo y planos DWG en Revit</title>

    <link rel="canonical" href="https://bimsaddin.com/">

    <!-- ── Versiones por idioma ──────────────────────────────────────────
         La landing es una SPA bilingüe: ?lang=en da a la versión en inglés una
         URL propia, rastreable e indexable. Sin esto (canonical fijo + idioma
         resuelto solo en cliente) el sitio en inglés era invisible para Google,
         justo el tráfico que trae el Autodesk App Store. LanguageProvider
         mantiene canonical/og sincronizados con el idioma activo. -->
    <link rel="alternate" hreflang="es" href="https://bimsaddin.com/">
    <link rel="alternate" hreflang="en" href="https://bimsaddin.com/?lang=en">
    <link rel="alternate" hreflang="x-default" href="https://bimsaddin.com/">

    <!-- ── Open Graph / Social media ────── -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://bimsaddin.com/">
    <meta property="og:title" content="BIMS — Lo que en Revit te toma horas, hazlo en minutos">
    <meta property="og:description" content="Add-in profesional para Revit que automatiza encofrado, refuerzo, tarrajeo y exportación DWG. Compatible con Revit 2024-2027.">
    <meta property="og:image" content="https://bimsaddin.com/icono/og-cover.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:locale" content="es_PE">
    <meta property="og:site_name" content="BIMS">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="BIMS — Lo que en Revit te toma horas, hazlo en minutos">
    <meta name="twitter:description" content="Add-in profesional para Revit que automatiza encofrado, refuerzo, tarrajeo y exportación DWG.">
    <meta name="twitter:image" content="https://bimsaddin.com/icono/og-cover.jpg">

    <link rel="icon" type="image/x-icon"             href="/icono/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32"  href="/icono/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16"  href="/icono/favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180"     href="/icono/apple-touch-icon.png">

    <!-- ── Google Analytics 4 ───────────────────────────────────────── -->
    <script async src="/ga4/gtag.js"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        // transport_url: manda los beacons de medición por bimsaddin.com en vez
        // de google-analytics.com directo — evita el bloqueo por dominio de la
        // mayoría de ad-blockers (uBlock, AdGuard, Brave, Safari ITP). Ver
        // netlify/functions/ga-script-proxy.js y ga-collect-proxy.js.
        gtag('config', 'G-P5ZL4FBL4S', { transport_url: 'https://bimsaddin.com' });
    </script>

    <!-- ── Microsoft Clarity ── -->
    <script type="text/javascript">
        (function(c,l,a,r,i,t,y){
            c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
            t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
            y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", "wrtgszpyuc");
    </script>

    <!-- ── Fuentes (Google Fonts — ya permitidas por la CSP) ──────────────
         Pesos recortados a los que el diseño usa de verdad (antes se pedían 12,
         incluidos varios que ningún componente aplica):
           · Bricolage Grotesque 700/800 → font-display (títulos, cifras)
           · Plus Jakarta Sans 400/500/600/700 → font-sans (cuerpo y botones)
           · JetBrains Mono 400 → font-mono (solo la consola simulada del hero)
         preload + onload: la hoja deja de bloquear el primer render. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style"
          href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap"
          onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap">
    </noscript>

    <!-- Miniaturas de YouTube (demo + 4 clips): abre la conexión en paralelo
         con el HTML en vez de esperar al primer <img>. -->
    <link rel="preconnect" href="https://i.ytimg.com" crossorigin>

    <!-- ── Culqi Checkout v4 (mismo contrato que la home actual) ──────────
         defer: sólo hace falta cuando el usuario abre el modal de compra, y en
         <head> síncrono bloqueaba el parser del HTML en TODAS las visitas. -->
    <script src="https://checkout.culqi.com/js/v4" defer></script>

    <!-- ── Datos estructurados (SoftwareApplication) ──────────────────────
         Permite a Google mostrar precio, categoría y compatibilidad en los
         resultados. Los precios son los de entrada en soles (plan Individual). -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "BIMS",
      "applicationCategory": "DesignApplication",
      "applicationSubCategory": "Autodesk Revit Add-in",
      "operatingSystem": "Windows 10, Windows 11",
      "softwareRequirements": "Autodesk Revit 2024, 2025, 2026 o 2027",
      "url": "https://bimsaddin.com/",
      "description": "Add-in profesional para Autodesk Revit que automatiza encofrado, refuerzo, tarrajeo y exportación DWG.",
      "inLanguage": ["es", "en"],
      "offers": {
        "@type": "Offer",
        "price": "60",
        "priceCurrency": "PEN",
        "category": "Licencia mensual",
        "url": "https://bimsaddin.com/#precios"
      },
      "publisher": {
        "@type": "Organization",
        "name": "BIMS",
        "email": "soporte@bimsaddin.com",
        "url": "https://bimsaddin.com/"
      }
    }
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
