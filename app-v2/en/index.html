    <!-- ── Página propia para el inglés ───────────────────────────────────
         Este archivo existe para que la versión en inglés EXISTA para un
         buscador. Antes los dos idiomas compartían la URL "/" y el cambio lo
         hacía React en el navegador: el HTML que se servía traía siempre el
         <title> y la description en español, así que para Google no había
         ninguna página en inglés que indexar — solo la española, que a veces
         se renderizaba en inglés.

         Es el MISMO bundle de React (mismo /src/main.jsx). Lo único que cambia
         es el HTML que envuelve: idioma, metadatos, canonical y datos
         estructurados. LanguageProvider detecta la ruta /en/ y arranca en
         inglés sin que la geolocalización pueda pisarlo. ────────────────── -->
    <link rel="canonical" href="https://bimsaddin.com/en/">
    <link rel="alternate" hreflang="es" href="https://bimsaddin.com/">
    <link rel="alternate" hreflang="en" href="https://bimsaddin.com/en/">
    <link rel="alternate" hreflang="x-default" href="https://bimsaddin.com/">

    <!-- ── Datos estructurados ──
         Describe el producto para que el buscador pueda enseñar precio,
         plataforma y valoración en el resultado.

         El aggregateRating y las reseñas son las REALES del Autodesk App Store
         y se pintan en la sección de reseñas de esta misma página — requisito
         de Google: no se puede marcar una valoración que el visitante no ve.
         Los números salen de app-v2/src/data/reviews.js; si cambian allí, hay
         que cambiarlos aquí y en en/index.html. Declarar una media distinta de
         la que se enseña es justo lo que Google penaliza. -->

        "ratingValue": "5",
        "bestRating": "5",
        "worstRating": "1",
        "ratingCount": 2,
        "reviewCount": 2
      },
      "review": [
        {
          "@type": "Review",
          "author": { "@type": "Person", "name": "Cesar Urbina" },
